<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aventurine Manage | Recurring</title>
    <!-- @include head -->
    <link rel="stylesheet" href="/static/css/ant.css">
    <link rel="stylesheet" href="/static/css/recurring.css">
</head>
<body>
    <!-- @include chrome -->

    <div class="body_container">
        <!-- @include sidebar -->

        <div class="page">

<!-- The workspace is drawn in Ant Design (ant.css, ant.js): the month controls,
     the month's totals as three Statistic cards, then the calendar and the
     schedule list as two cards side by side. The app chrome around it keeps
     its own design. -->
<div class="rec-page ant-scope">

    <!-- The month, hard left: a compact previous / month / next control, the
         month opening Ant's month panel, then Today. No page heading: the
         sidebar's active link already names the page, as on every other page.
         Today stays in place and goes disabled on the current month rather
         than disappearing, so the controls never shift. -->
    <div class="rec-toolbar">
        <div class="ant-space-compact" role="group" aria-label="Calendar month">
            <button type="button" class="ant-btn ant-btn-default ant-btn-icon-only" id="rec-month-prev"
                aria-label="Previous month" data-tip="Previous month"><span class="anticon" data-ant-icon="left" aria-hidden="true"></span></button>
            <button type="button" class="ant-picker rec-month-picker" id="rec-month-label"
                aria-haspopup="dialog" aria-expanded="false">
                <span class="ant-picker-input" id="rec-month-text" aria-live="polite">&nbsp;</span>
                <span class="ant-picker-suffix"><span class="anticon" data-ant-icon="calendar" aria-hidden="true"></span></span>
            </button>
            <button type="button" class="ant-btn ant-btn-default ant-btn-icon-only" id="rec-month-next"
                aria-label="Next month" data-tip="Next month"><span class="anticon" data-ant-icon="right" aria-hidden="true"></span></button>
        </div>
        <button type="button" class="ant-btn ant-btn-default" id="rec-month-today">Today</button>
    </div>

    <!-- What the month on screen is expected to bring in, pay out and move.
         Empty until recurring.js has a month to total. -->
    <div class="rec-stats" id="rec-summary"></div>

    <!-- The calendar and the list of every schedule. The list is never hidden:
         its foot carries Create and Detect, so a calendar with nothing on it yet
         still has both in reach. -->
    <div class="rec-main" id="rec-main">
        <section class="ant-card rec-calendar" id="rec-calendar" aria-label="Calendar"></section>
        <section class="ant-card rec-rail" id="rec-rail" aria-label="Schedules"></section>
    </div>

</div>

        </div>
    </div>

    <!-- @include scripts -->
    <!-- Merchant avatars: the generated slug→icon manifest, then the renderer
         that reads it. Page-level rather than shared chrome — see the note in
         pages/partials/scripts.html. Manifest first: avatar.js reads
         window.MERCHANT_ICONS. -->
    <script src="/static/js/core/merchant-icons.js"></script>
    <script src="/static/js/core/avatar.js"></script>
    <!-- Ant Design's interactive pieces. After the shared block: its Modal is
         UI.dialog underneath. -->
    <script src="/static/js/widgets/ant.js"></script>
    <script src="/static/js/pages/recurring.js"></script>
</body>
</html>
