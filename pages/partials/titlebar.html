<!-- The frameless window's title bar. Its own partial because the sign-in
     page (pages/signin.html) needs the window controls but none of the rest
     of the chrome. Spliced into pages/*.html by the app:// protocol handler
     (electron/main.js), just before the chrome include. Wired by
     static/js/shell/titlebar.js and history.js. -->
    <div class="titlebar">
        <img class="titlebar-icon" src="/static/icons/logo/logo.svg" alt="Aventurine Manage" draggable="false">
        <!-- Back / forward through the session history. Every page is its own
             document under app://, so the trail already exists; these two walk
             it. static/js/shell/history.js wires them and owns the keyboard and
             mouse paths as well. They start disabled: the main process is what
             knows which directions exist, and it is asked after load. -->
        <div class="titlebar-nav">
            <button type="button" class="titlebar-nav-btn" data-nav="back" aria-label="Back" disabled>
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
            </button>
            <button type="button" class="titlebar-nav-btn" data-nav="forward" aria-label="Forward" disabled>
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path></svg>
            </button>
        </div>
        <div class="titlebar-drag"></div>
        <!-- Name of the currently open database, centered over the bar.
             Populated by titlebar.js from /api/db/status; empty (hidden) until
             then and in a plain browser where the chrome is unavailable. -->
        <div class="titlebar-title" data-db-name aria-live="polite"></div>
        <!-- Window controls. The same three buttons on every OS; titlebar.css
             dresses them to match the platform (set on <html data-platform> in
             theme-init.js): macOS traffic lights on the left, square controls on
             the right elsewhere. The maximize button carries both a square glyph
             (Windows/Linux) and a "+" glyph (macOS); CSS shows the right one. -->
        <div class="titlebar-controls">
            <button class="titlebar-btn titlebar-btn-min" data-action="min" aria-label="Minimize" tabindex="-1">
                <svg viewBox="0 0 12 12" fill="none"><path d="M2 6h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="titlebar-btn titlebar-btn-max" data-action="max" aria-label="Maximize" tabindex="-1">
                <svg class="tb-glyph tb-glyph-default" viewBox="0 0 12 12" fill="none"><rect x="2.5" y="2.5" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
                <svg class="tb-glyph tb-glyph-mac" viewBox="0 0 12 12" fill="none"><path d="M6 2.5v7M2.5 6h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <button class="titlebar-btn titlebar-btn-close" data-action="close" aria-label="Close" tabindex="-1">
                <svg viewBox="0 0 12 12" fill="none"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
        </div>
    </div>
