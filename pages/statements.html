<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aventurine Manage | Statements</title>
    <!-- @include head -->
    <link rel="stylesheet" href="/static/css/ant.css">
    <link rel="stylesheet" href="/static/css/statements.css">
</head>
<body>
    <!-- @include chrome -->

    <div class="body_container">
        <!-- @include sidebar -->

        <div class="page">

<!-- The workspace is drawn in Ant Design (ant.css, ant.js), like Recurring,
     Portfolio, Reports and Budgets: line Tabs with the year and the two
     managers beside them, then the selected year's statement. The app chrome
     around it keeps its own design. -->
<div class="stmt-page ant-scope">

    <!-- Ant's Tabs with tabBarExtraContent: the two statements hard left, the
         year control and the two managers hard right on the same hairline.
         When the row is too narrow the right-hand group wraps ABOVE the tabs,
         so the hairline stays under them. No page heading: the sidebar's
         active link already names the page, as on every other page.
         Controller: statements.js; the managers: stmtmanagers.js. -->
    <div class="ant-tabs-nav stmt-bar">
        <div class="stmt-tablist" role="tablist" aria-label="Statements">
            <button type="button" class="ant-tabs-tab" id="stmt-tab-cashflow" role="tab" data-tab="cashflow"
                aria-controls="stmt-panel-cashflow" aria-selected="true">Cash Flow</button>
            <button type="button" class="ant-tabs-tab" id="stmt-tab-balance" role="tab" data-tab="balance"
                aria-controls="stmt-panel-balance" aria-selected="false" tabindex="-1">Balance Sheet</button>
        </div>
        <div class="stmt-extra">
            <div class="ant-space-compact" role="group" aria-label="Statement year">
                <button type="button" class="ant-btn ant-btn-default ant-btn-icon-only" id="stmt-year-prev"
                    aria-label="Previous year" data-tip="Previous year" disabled><span class="anticon" data-ant-icon="left" aria-hidden="true"></span></button>
                <span class="ant-select stmt-year-select">
                    <select class="ant-select-selector" id="stmt-year-select" aria-label="Statement year" disabled></select>
                    <span class="ant-select-arrow"><span class="anticon" data-ant-icon="down" aria-hidden="true"></span></span>
                </span>
                <button type="button" class="ant-btn ant-btn-default ant-btn-icon-only" id="stmt-year-next"
                    aria-label="Next year" data-tip="Next year" disabled><span class="anticon" data-ant-icon="right" aria-hidden="true"></span></button>
            </div>
            <button type="button" class="ant-btn ant-btn-default" id="stmt-years-btn"><span class="anticon" data-ant-icon="calendar" aria-hidden="true"></span><span>Manage Years</span></button>
            <button type="button" class="ant-btn ant-btn-default" id="stmt-columns-btn"><span class="anticon" data-ant-icon="insert-row-right" aria-hidden="true"></span><span>Manage Columns</span></button>
        </div>
    </div>

    <!-- One card per statement year goes in each container (widgets/tables.js);
         the page shows the selected one. The empty slot stands in when that
         year has no table here, or the statement has nothing to draw. -->
    <div class="stmt-panel" id="stmt-panel-cashflow" role="tabpanel" aria-labelledby="stmt-tab-cashflow">
        <div class="stmt-years stmt-sheet-cashflow" id="stmt-tables-cashflow"></div>
        <section class="ant-card stmt-empty" id="stmt-empty-cashflow" hidden></section>
    </div>
    <div class="stmt-panel" id="stmt-panel-balance" role="tabpanel" aria-labelledby="stmt-tab-balance" hidden>
        <div class="stmt-years stmt-sheet-balance" id="stmt-tables-balance"></div>
        <section class="ant-card stmt-empty" id="stmt-empty-balance" hidden></section>
    </div>

</div>

        </div>
    </div>

    <!-- @include scripts -->
    <!-- Ant Design's interactive pieces come after the shared block: its Modal
         is UI.dialog underneath. The grid (tables.js) draws Ant icons and range
         selection (cellselect.js), so both load before it. -->
    <script src="/static/js/widgets/ant.js"></script>
    <script src="/static/js/widgets/cellselect.js"></script>
    <script src="/static/js/widgets/tables.js"></script>
    <script src="/static/js/pages/stmtmanagers.js"></script>
    <script src="/static/js/pages/statements.js"></script>
</body>
</html>
