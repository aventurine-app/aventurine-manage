<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aventurine Manage | Dashboard</title>
    <!-- @include head -->
    <!-- Drawn in Ant Design (ant.css, ant.js), like the other workspaces. -->
    <link rel="stylesheet" href="/static/css/ant.css">
    <link rel="stylesheet" href="/static/css/donut.css">
    <!-- The stacked-column rules (.chart-col, .chart-seg) the Spending card draws with. -->
    <link rel="stylesheet" href="/static/css/transfers.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <!-- First-run setup (onboarding.css) hands its file to the ordinary
         import wizard: tximport.css for the wizard's own rows. -->
    <link rel="stylesheet" href="/static/css/onboarding.css">
    <link rel="stylesheet" href="/static/css/tximport.css">
</head>
<body>
    <!-- @include chrome -->

    <div class="body_container">
        <!-- @include sidebar -->

        <div class="page">

<div class="dashboard-page ant-scope">

    <!-- First-run hero. Replaces the dashboard only while the database holds
         nothing the user put there and they haven't waved setup off (both
         answered by GET /api/onboarding). Hidden by default so a database with
         data never flashes it before the check resolves; maybeOfferOnboarding()
         in dashboard.js reveals it. Skipping removes it and shows the ordinary
         dashboard, whose own empty states lead into each surface. -->
    <div class="dashboard-firstrun" id="dashboard-firstrun" hidden>
        <section class="ant-card dashboard-firstrun-card">
            <div class="ant-card-body">
                <img class="dashboard-firstrun-logo" src="/static/icons/logo/logo.svg" alt="" width="56" height="56" draggable="false">
                <h1 class="dashboard-firstrun-title">Your dashboard is empty. Let’s fix that.</h1>
                <p class="dashboard-firstrun-sub">Point Aventurine Manage at one transaction export and it
                    builds your ledger, statements and charts from it. Everything is read and
                    categorized on this computer; nothing is uploaded.</p>
                <div class="dashboard-firstrun-actions">
                    <button type="button" class="ant-btn ant-btn-primary ant-btn-lg" id="dashboard-firstrun-start">Set up my accounts</button>
                    <button type="button" class="ant-btn ant-btn-text ant-btn-lg" id="dashboard-firstrun-skip">Skip for now</button>
                </div>
            </div>
        </section>
    </div>

    <!-- The dashboard: the layouts as line Tabs, with Customize as their extra
         content hard right on the same hairline, over a grid of cards. While
         customizing the tabs turn editable cards and the extra content becomes
         the layout's name, Add widgets, Cancel and Save. dashboard.js builds
         the tabs, the controls, the cards and the widget Drawer from the saved
         layouts; the cards themselves are defined in dashcards.js. No page
         heading: the sidebar's active link already names the page. -->
    <div class="dash-shell">
        <div class="ant-tabs-nav dash-bar" id="dash-toolbar">
            <div class="dash-layouts" id="dash-layouts"></div>
            <div class="dash-extra" id="dash-actions"></div>
        </div>
        <div class="dash-main">
            <div class="dash-canvas" id="dash-canvas" role="tabpanel">
                <div class="dash-placeholder" id="dash-placeholder" hidden></div>
            </div>
            <section class="ant-card dash-empty" id="dash-empty" hidden></section>
        </div>
    </div>

    <div class="ant-visually-hidden" id="dash-live" aria-live="polite"></div>

</div>
        </div>
    </div>

    <!-- @include scripts -->
    <!-- The shared chart geometry (core/chartmath.js). Per-page rather than in
         the shared block: only this page and /reports draw charts, so the other
         four would parse it for nothing. It has no dependencies and must load
         before any script that draws. -->
    <script src="/static/js/core/chartmath.js"></script>
    <!-- The line renderer (widgets/chart.js) the line cards share with /reports. -->
    <script src="/static/js/widgets/chart.js"></script>
    <!-- The ring the Breakdown card draws (shared with /portfolio). -->
    <script src="/static/js/widgets/donut.js"></script>
    <!-- The grid engine and the period rules: pure, and read by the cards and
         the page script below. -->
    <script src="/static/js/widgets/dashgrid.js"></script>
    <script src="/static/js/widgets/dashperiod.js"></script>
    <!-- Merchant avatars (Top Merchants, Recent Transactions, Upcoming Bills):
         the generated manifest, then the renderer that reads it. -->
    <script src="/static/js/core/merchant-icons.js"></script>
    <script src="/static/js/core/avatar.js"></script>
    <!-- Ant Design's interactive pieces (Popover, Drawer, Dropdown, the month
         panel, Modal for the import wizard), before the cards that use them. -->
    <script src="/static/js/widgets/ant.js"></script>
    <!-- Every card the dashboard can hold, then the page that places them. -->
    <script src="/static/js/pages/dashcards.js"></script>
    <!-- The import wizard first-run setup opens: the parser, then the wizard. -->
    <script src="/static/js/widgets/txparse.js"></script>
    <script src="/static/js/widgets/txfileimport.js"></script>
    <script src="/static/js/widgets/onboarding.js"></script>
    <script src="/static/js/pages/dashboard.js"></script>
</body>
</html>
