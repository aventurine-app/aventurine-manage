<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aventurine Manage | Budgets</title>
    <!-- @include head -->
    <link rel="stylesheet" href="/static/css/ant.css">
    <link rel="stylesheet" href="/static/css/budgets.css">
</head>
<body>
    <!-- @include chrome -->

    <div class="body_container">
        <!-- @include sidebar -->

        <div class="page">

<!-- The workspace is drawn in Ant Design (ant.css, ant.js), like Recurring,
     Portfolio and Reports: the toolbar, the month's figures as four Statistic
     cards, then one card holding the targets as circles or as a table. The app
     chrome around it keeps its own design. -->
<div class="bud-page ant-scope">

    <!-- Hard left: a compact previous / month / next control (the month opens
         Ant's month panel), then the Circles / List switch. Set Budget, the
         page's one action, hard right. No page heading: the sidebar's active
         link already names the page, as on every other page. -->
    <div class="bud-toolbar">
        <div class="ant-space-compact" role="group" aria-label="Budget month">
            <button type="button" class="ant-btn ant-btn-default ant-btn-icon-only" id="bud-month-prev"
                aria-label="Previous month" data-tip="Previous month"><span class="anticon" data-ant-icon="left" aria-hidden="true"></span></button>
            <button type="button" class="ant-picker bud-month-picker" id="bud-month-label"
                aria-haspopup="dialog" aria-expanded="false">
                <span class="ant-picker-input" id="bud-month-text" aria-live="polite">&nbsp;</span>
                <span class="ant-picker-suffix"><span class="anticon" data-ant-icon="calendar" aria-hidden="true"></span></span>
            </button>
            <button type="button" class="ant-btn ant-btn-default ant-btn-icon-only" id="bud-month-next"
                aria-label="Next month" data-tip="Next month"><span class="anticon" data-ant-icon="right" aria-hidden="true"></span></button>
        </div>
        <div class="ant-segmented" id="bud-view" role="group" aria-label="Show budgets as">
            <button type="button" class="ant-segmented-item" data-view="circles" aria-pressed="true"><span class="anticon" data-ant-icon="appstore" aria-hidden="true"></span>Circles</button>
            <button type="button" class="ant-segmented-item" data-view="list" aria-pressed="false"><span class="anticon" data-ant-icon="unordered-list" aria-hidden="true"></span>List</button>
        </div>
        <button type="button" class="ant-btn ant-btn-primary bud-set-btn" id="bud-set-btn"><span class="anticon" data-ant-icon="edit" aria-hidden="true"></span>Set Budget</button>
    </div>

    <!-- Budgeted, spent, left (or over), and saved & invested, for the month
         on the toolbar. Empty until budgets.js has a month to total. -->
    <div class="bud-stats" id="bud-stats" hidden></div>

    <!-- The targets. In Circles, #bud-field is the box BubbleField measures, so
         it must have a size of its own before the first circle is drawn
         (budgets.css gives it one). In List, #bud-list holds the table. -->
    <section class="ant-card bud-card" id="bud-card" aria-label="Budgets" hidden>
        <div class="bud-field" id="bud-field"></div>
        <div class="bud-list" id="bud-list" hidden></div>
    </section>

    <!-- What the month spent in categories that have no target. -->
    <p class="bud-note ant-typography-secondary" id="bud-unbudgeted" hidden></p>

    <!-- Replaces the cards and the note while there is nothing to draw. -->
    <section class="ant-card bud-empty" id="bud-empty" hidden></section>

</div>

        </div>
    </div>

    <!-- @include scripts -->
    <!-- No chart.js here. The circles are DOM, not a chart, and their colour is
         a token in budgets.css rather than a per-category ramp, so nothing on
         this page needs the chart widget. Ant Design's interactive pieces come
         after the shared block: its Modal is UI.dialog underneath. -->
    <script src="/static/js/widgets/ant.js"></script>
    <script src="/static/js/widgets/bubblefield.js"></script>
    <script src="/static/js/pages/budgets.js"></script>
</body>
</html>
