<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aventurine Manage | Transactions</title>
    <!-- @include head -->
    <link rel="stylesheet" href="/static/css/ant.css">
    <link rel="stylesheet" href="/static/css/transactions.css">
    <!-- The import wizard's own rows; the Dashboard's first-run setup opens
         the same wizard and loads this file too. -->
    <link rel="stylesheet" href="/static/css/tximport.css">
</head>
<body>
    <!-- @include chrome -->

    <div class="body_container">
        <!-- @include sidebar -->

        <div class="page">

<!-- The workspace is drawn in Ant Design (ant.css, ant.js), like Recurring,
     Portfolio, Reports, Budgets and Statements: the page's three actions, then
     one card holding the filters, the bar for the rows ticked, the ledger
     table and its pages. The app chrome around it keeps its own design. -->
<div class="tx-page ant-scope">

    <!-- Hard left, like the other pages' toolbars. No page heading: the
         sidebar's active link already names the page. -->
    <div class="tx-toolbar">
        <button type="button" class="ant-btn ant-btn-default" id="tx-import-btn"><span class="anticon" data-ant-icon="upload" aria-hidden="true"></span>Import</button>
        <button type="button" class="ant-btn ant-btn-default" id="tx-export-btn"><span class="anticon" data-ant-icon="download" aria-hidden="true"></span>Export</button>
        <button type="button" class="ant-btn ant-btn-primary" id="tx-add-btn"><span class="anticon" data-ant-icon="plus" aria-hidden="true"></span>Add transaction</button>
    </div>

    <section class="ant-card tx-ledger" aria-label="Ledger">

        <!-- The six filters in the table's order of interest: a search, the
             dates, then Type, Account and Category (each several values at
             once) and Amount. transactions.js builds the Selects and the date
             range into their slots. Clear filters shows while any is set. -->
        <div class="tx-filters">
            <div class="tx-filter-row" role="search" aria-label="Filter transactions">
                <span class="ant-input-affix-wrapper tx-search">
                    <span class="ant-input-prefix"><span class="anticon" data-ant-icon="search" aria-hidden="true"></span></span>
                    <input type="text" class="ant-input" id="tx-search" placeholder="Search descriptions and notes"
                        aria-label="Search descriptions and notes" autocomplete="off" spellcheck="false">
                    <span class="ant-input-suffix"><button type="button" class="ant-input-clear-icon" id="tx-search-clear"
                        aria-label="Clear the search"><span class="anticon" data-ant-icon="close-circle" aria-hidden="true"></span></button></span>
                </span>
                <div class="tx-dates" id="tx-dates"></div>
                <div class="tx-filter-type" id="tx-filter-type"></div>
                <div class="tx-filter-account" id="tx-filter-account"></div>
                <div class="tx-filter-category" id="tx-filter-category"></div>
                <button type="button" class="ant-btn ant-btn-default" id="tx-amount-btn" aria-haspopup="dialog" aria-expanded="false">
                    <span class="anticon" data-ant-icon="filter" aria-hidden="true"></span><span id="tx-amount-text">Amount</span>
                </button>
                <button type="button" class="ant-btn ant-btn-link" id="tx-clear-filters" hidden>Clear filters</button>
            </div>
        </div>

        <!-- The rows ticked: how many, their net, and what can be done to
             them. Shown only while at least one is ticked. -->
        <div class="tx-batch" id="tx-batch" role="region" aria-label="Selected transactions" hidden>
            <span class="ant-typography-strong" id="tx-batch-count"></span>
            <span class="ant-typography-secondary tx-num" id="tx-batch-net"></span>
            <div class="tx-batch-actions">
                <button type="button" class="ant-btn ant-btn-default ant-btn-sm" id="tx-batch-edit"><span class="anticon" data-ant-icon="edit" aria-hidden="true"></span>Edit</button>
                <button type="button" class="ant-btn ant-btn-default ant-btn-sm ant-btn-dangerous" id="tx-batch-delete"><span class="anticon" data-ant-icon="delete" aria-hidden="true"></span>Delete</button>
                <button type="button" class="ant-btn ant-btn-text ant-btn-sm" id="tx-batch-clear"><span class="anticon" data-ant-icon="close" aria-hidden="true"></span>Clear</button>
            </div>
        </div>

        <!-- The ledger. Its header is drawn by transactions.js too (the
             sorters and the select-all box follow the state); the body is
             one page of the filtered rows. -->
        <div class="ant-table-wrapper tx-table-wrap">
            <table class="ant-table ant-table-middle ant-table-fixed tx-table">
                <thead id="tx-thead"></thead>
                <tbody id="tx-tbody"></tbody>
            </table>
        </div>

        <ul class="tx-pagination" id="tx-pagination" aria-label="Pages" hidden></ul>
    </section>
</div>
        </div>
    </div>

    <!-- @include scripts -->
    <!-- Merchant avatars: the generated slug→icon manifest, then the renderer
         that reads it. Page-level rather than shared chrome — see the note in
         pages/partials/scripts.html. Manifest first: avatar.js reads
         window.MERCHANT_ICONS. -->
    <script src="/static/js/core/merchant-icons.js"></script>
    <script src="/static/js/core/avatar.js"></script>
    <!-- Ant Design's interactive pieces. After the shared block: its Modal is
         UI.dialog underneath. -->
    <script src="/static/js/widgets/ant.js"></script>
    <script src="/static/js/widgets/txparse.js"></script>
    <script src="/static/js/widgets/txfileimport.js"></script>
    <script src="/static/js/widgets/txexport.js"></script>
    <script src="/static/js/pages/transactions.js"></script>
</body>
</html>
