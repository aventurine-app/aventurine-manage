<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Aventurine Manage | Reports</title>
    <!-- @include head -->
    <link rel="stylesheet" href="/static/css/ant.css">
    <link rel="stylesheet" href="/static/css/forecast.css">
    <link rel="stylesheet" href="/static/css/trends.css">
    <link rel="stylesheet" href="/static/css/transfers.css">
    <link rel="stylesheet" href="/static/css/metrics.css">
</head>
<body>
    <!-- @include chrome -->

    <div class="body_container">
        <!-- @include sidebar -->

        <div class="page">

<!-- The reports are drawn in Ant Design (ant.css, ant.js): line Tabs over one
     Card per report. The app chrome around them keeps its own design. -->
<div class="rep-reports ant-scope">

    <!-- Report tabs. Adding another report = a .rep-tab button here + a matching
         .rep-panel below, in the same order. Controller: reports.js (data-driven,
         no JS change). Each panel owns its own controls — a report's pickers live
         in its card header (or its own toolbar row), never hoisted up here, so a
         report stays a self-contained block of markup. -->
    <div class="rep-tabs ant-tabs-nav" role="tablist" aria-label="Reports">
        <button type="button" class="rep-tab ant-tabs-tab" id="rep-tab-cashflow" role="tab"
            data-tab="cashflow" aria-controls="rep-panel-cashflow" aria-selected="true">Cash Flow</button>
        <button type="button" class="rep-tab ant-tabs-tab" id="rep-tab-spending" role="tab"
            data-tab="spending" aria-controls="rep-panel-spending" aria-selected="false" tabindex="-1">Spending</button>
        <button type="button" class="rep-tab ant-tabs-tab" id="rep-tab-transfers" role="tab"
            data-tab="transfers" aria-controls="rep-panel-transfers" aria-selected="false" tabindex="-1">Saved &amp; Invested</button>
        <button type="button" class="rep-tab ant-tabs-tab" id="rep-tab-forecast" role="tab"
            data-tab="forecast" aria-controls="rep-panel-forecast" aria-selected="false" tabindex="-1">Forecast</button>
        <button type="button" class="rep-tab ant-tabs-tab" id="rep-tab-metrics" role="tab"
            data-tab="metrics" aria-controls="rep-panel-metrics" aria-selected="false" tabindex="-1">Metrics</button>
    </div>

    <div class="rep-panel" id="rep-panel-cashflow" role="tabpanel"
        data-panel="cashflow" aria-labelledby="rep-tab-cashflow" tabindex="0">

<div class="forecast-page">

    <section class="ant-card forecast-card forecast-card-main" aria-labelledby="cashflow-title">
        <div class="ant-card-head"><div class="ant-card-head-wrapper">
            <h2 class="ant-card-head-title" id="cashflow-title">Cash Flow<span class="ant-info-tip" tabindex="0" role="note"
                aria-label="Income is shown on the left. Expenses are shown on the right. Hover a band to see total amount. Click on a band to be taken to a list of transactions."
                data-tip="Income is shown on the left. Expenses are shown on the right. Hover a band to see total amount. Click on a band to be taken to a list of transactions."><span class="anticon" data-ant-icon="info-circle-outlined" aria-hidden="true"></span></span></h2>
            <div class="ant-card-extra">
                <!-- Year and month as one joined Select pair (Space.Compact). -->
                <div class="range-selector-pair">
                    <div class="range-selector" id="cashflow-year">
                        <button class="range-selector-btn" id="cashflow-year-btn" type="button"
                            aria-haspopup="menu">Year<span class="anticon picker-caret" data-ant-icon="down" aria-hidden="true"></span></button>
                        <div class="range-selector-menu" id="cashflow-year-menu" hidden></div>
                    </div>
                    <div class="range-selector" id="cashflow-month">
                        <button class="range-selector-btn" id="cashflow-month-btn" type="button"
                            aria-haspopup="menu">Entire year<span class="anticon picker-caret" data-ant-icon="down" aria-hidden="true"></span></button>
                        <div class="range-selector-menu" id="cashflow-month-menu" hidden></div>
                    </div>
                </div>
            </div>
        </div></div>

        <div class="ant-card-body">
            <!-- Empty state lands here when the selected year has no data. -->
            <div id="cashflow-empty"></div>

            <div class="chart-area">
                <div id="cashflow-chart"></div>
            </div>
        </div>
    </section>

</div>

    </div><!-- /.rep-panel -->

    <div class="rep-panel" id="rep-panel-spending" role="tabpanel"
        data-panel="spending" aria-labelledby="rep-tab-spending" tabindex="0" hidden>

<div class="trends-page">

    <section class="ant-card trends-card" aria-labelledby="trends-title">
        <div class="ant-card-head"><div class="ant-card-head-wrapper">
            <h2 class="ant-card-head-title" id="trends-title">Spending Trends<span class="ant-info-tip" tabindex="0" role="note"
                aria-label="Each line is one expense category's spending per month over the selected window (the current, incomplete month is excluded). Toggle categories below to focus the view."
                data-tip="Each line is one expense category's spending per month over the selected window (the current, incomplete month is excluded). Toggle categories below to focus the view."><span class="anticon" data-ant-icon="info-circle-outlined" aria-hidden="true"></span></span></h2>
            <div class="ant-card-extra">
                <div class="trends-controls" id="trends-controls">
                    <!-- Chart form. Stacked answers "what makes up my spending",
                         lines answer "did this one category move" — two readings of
                         one payload, so the switch costs a re-render and no request.
                         Controller: static/js/pages/trends.js. -->
                    <div class="trends-view ant-segmented" id="trends-view" role="group" aria-label="Chart form">
                        <button type="button" class="ant-segmented-item" data-view="stacked" aria-pressed="true">Stacked</button>
                        <button type="button" class="ant-segmented-item" data-view="lines" aria-pressed="false">Lines</button>
                    </div>
                    <div class="range-selector" id="trends-range">
                        <button class="range-selector-btn" id="trends-range-btn" type="button"
                            aria-haspopup="menu">1 Year<span class="anticon picker-caret" data-ant-icon="down" aria-hidden="true"></span></button>
                        <div class="range-selector-menu" id="trends-range-menu" hidden>
                            <button data-window="3"  type="button">3 Months</button>
                            <button data-window="6"  type="button">6 Months</button>
                            <button data-window="12" type="button">1 Year</button>
                            <button data-window="24" type="button">2 Years</button>
                            <button data-window="60" type="button">5 Years</button>
                        </div>
                    </div>
                </div>
            </div>
        </div></div>

        <!-- Chart and rail are one row: the rail is the legend AND the table
             view, so every category's window total is on screen beside the
             shape it made, rather than reachable only by hovering the chart. -->
        <div class="ant-card-body trends-body">
            <div class="chart-area">
                <div id="trends-chart"></div>
            </div>
            <div class="trends-rail" id="trends-rail"></div>
        </div>
    </section>

    <!-- Top Merchants. The card above breaks spending down by category, month by
         month; this one breaks the same ledger down by merchant, totalled. Its
         window picker is its own — a report's controls live in its header, not in
         the tab bar (see the note at the top of this file). Controller:
         static/js/pages/topmerchants.js. -->
    <section class="ant-card trends-card" aria-labelledby="merchants-title">
        <div class="ant-card-head"><div class="ant-card-head-wrapper">
            <h2 class="ant-card-head-title" id="merchants-title">Top Merchants<span class="ant-info-tip" tabindex="0" role="note"
                aria-label="Top 20 merchants based on Expenses (excludes Income and Transfers). Click on merchant name to be taken to transaction list."
                data-tip="Top 20 merchants based on Expenses (excludes Income and Transfers). Click on merchant name to be taken to transaction list."><span class="anticon" data-ant-icon="info-circle-outlined" aria-hidden="true"></span></span></h2>
            <div class="ant-card-extra">
                <div class="trends-controls">
                    <!-- The category tag the Trends rail sets, when one is
                         focused. Empty markup otherwise. -->
                    <div class="tm-filter" id="merchants-filter"></div>
                    <div class="range-selector" id="merchants-range">
                        <button class="range-selector-btn" id="merchants-range-btn" type="button"
                            aria-haspopup="menu">1 Year<span class="anticon picker-caret" data-ant-icon="down" aria-hidden="true"></span></button>
                        <div class="range-selector-menu" id="merchants-range-menu" hidden>
                            <button data-window="3"  type="button">3 Months</button>
                            <button data-window="6"  type="button">6 Months</button>
                            <button data-window="12" type="button">1 Year</button>
                            <button data-window="24" type="button">2 Years</button>
                            <button data-window="60" type="button">5 Years</button>
                        </div>
                    </div>
                </div>
            </div>
        </div></div>

        <div class="ant-card-body" id="merchants-chart"></div>
    </section>

</div>

    </div><!-- /.rep-panel -->

    <div class="rep-panel" id="rep-panel-transfers" role="tabpanel"
        data-panel="transfers" aria-labelledby="rep-tab-transfers" tabindex="0" hidden>

<div class="tfr-page">

    <!-- Investing. Two cards, ONE picker: the second card is the first one
         broken out by account — one band per Transfer row of the Cash Flow
         grid — so the two are readings of the same statement cells over the
         same months and the stack has to total the line. Two pickers would
         let them fall out of step, and a stack that doesn't explain the chart
         beside it is worse than no second chart. The panel-level toolbar row is
         the sanctioned home for a control that scopes more than one card (see
         the note at the top of this file); a report's controls still never get
         hoisted into the tab bar. Controller: static/js/pages/transfers.js.

         The two cards sit SIDE BY SIDE in .tfr-charts. Both charts are the same
         months at the same width, so they draw at the same height and their
         month axes line up across the gap — which is the whole reason to put a
         stack next to the line it totals rather than under it, since comparing
         a column to its point no longer costs a scroll. -->
    <div class="tfr-toolbar">
        <div class="range-selector" id="transfers-range">
            <button class="range-selector-btn" id="transfers-range-btn" type="button"
                aria-haspopup="menu" title="Time frame for both charts">12 Months<span class="anticon picker-caret" data-ant-icon="down" aria-hidden="true"></span></button>
            <div class="range-selector-menu" id="transfers-range-menu" hidden>
                <button data-window="3"  type="button">3 Months</button>
                <button data-window="6"  type="button">6 Months</button>
                <button data-window="12" type="button">12 Months</button>
                <button data-window="24" type="button">24 Months</button>
            </div>
        </div>
    </div>

    <div class="tfr-charts">

    <section class="ant-card tfr-card" aria-labelledby="transfers-title">
        <div class="ant-card-head"><div class="ant-card-head-wrapper">
            <h2 class="ant-card-head-title" id="transfers-title">Saved &amp; Invested Over Time<span class="ant-info-tip" tabindex="0" role="note"
                aria-label="How much you moved into your own savings and investment accounts each month. Any category you have set to Transfer counts, so nothing needs sorting by hand. Money moved this way is never counted as spending, so this is the one place it is reported. The current, incomplete month is excluded."
                data-tip="How much you moved into your own savings and investment accounts each month. Any category you have set to Transfer counts, so nothing needs sorting by hand. Money moved this way is never counted as spending, so this is the one place it is reported. The current, incomplete month is excluded."><span class="anticon" data-ant-icon="info-circle-outlined" aria-hidden="true"></span></span></h2>
            <div class="ant-card-extra tfr-total" id="transfers-total"></div>
        </div></div>

        <div class="ant-card-body">
            <div class="chart-area">
                <div id="transfers-chart"></div>
            </div>
        </div>
    </section>

    <section class="ant-card tfr-card" aria-labelledby="transfers-accounts-title">
        <div class="ant-card-head"><div class="ant-card-head-wrapper">
            <h2 class="ant-card-head-title" id="transfers-accounts-title">Saved &amp; Invested by Account<span class="ant-info-tip" tabindex="0" role="note"
                aria-label="The same months split by which of your accounts the money went into, taken from the Transfer rows of the Cash Flow statement. The eight biggest get their own color and everything else is grouped as Other, so the columns always add up to the trend chart. Click a name to see those transactions."
                data-tip="The same months split by which of your accounts the money went into, taken from the Transfer rows of the Cash Flow statement. The eight biggest get their own color and everything else is grouped as Other, so the columns always add up to the trend chart. Click a name to see those transactions."><span class="anticon" data-ant-icon="info-circle-outlined" aria-hidden="true"></span></span></h2>
        </div></div>

        <div class="ant-card-body">
            <div class="chart-area">
                <div id="transfers-accounts-chart"></div>
            </div>
            <div class="tfr-legend" id="transfers-legend"></div>
        </div>
    </section>

    </div><!-- /.tfr-charts -->

</div>

    </div><!-- /.rep-panel -->

    <div class="rep-panel" id="rep-panel-forecast" role="tabpanel"
        data-panel="forecast" aria-labelledby="rep-tab-forecast" tabindex="0" hidden>

<div class="forecast-page">

    <!-- ONE card: the projected line is the report, and the sentence above it
         states the answer in words before the chart shows the shape. Planned
         items used to live in a second card with their own form; they are now
         pins ON the line (see forecast.js) — same idiom as the Recurring
         calendar's chips, where the thing you point at is the thing you edit.
         The header carries the three knobs the report is read through: whether
         money moved between your own accounts counts, which account, and how
         far ahead. The ⋮ holds only the housekeeping action, and only when
         there is something for it to clear. -->
    <section class="ant-card forecast-card forecast-card-main" aria-labelledby="forecast-title">
        <div class="ant-card-head"><div class="ant-card-head-wrapper">
            <!-- "Balance Forecast", not "Cash Flow Forecast": what it projects is
                 one account's BALANCE, and the sibling tab is already called Cash
                 Flow. The method — and the way to pin a planned item — lives in
                 this one tooltip rather than in standing text above the chart. -->
            <h2 class="ant-card-head-title" id="forecast-title">Balance Forecast<span class="ant-info-tip" tabindex="0" role="note"
                aria-label="Projects one account's balance forward, week by week. Each week combines your typical spending and income (averaged over recent complete months), timed by your regular bills and paychecks. The shaded band is the typical range, widening with distance as recent months varied. Hover the line to pin a one-off payment or receipt to a date; hover a point for that week's balance."
                data-tip="Projects one account's balance forward, week by week. Each week combines your typical spending and income (averaged over recent complete months), timed by your regular bills and paychecks. The shaded band is the typical range, widening with distance as recent months varied. Hover the line to pin a one-off payment or receipt to a date; hover a point for that week's balance."><span class="anticon" data-ant-icon="info-circle-outlined" aria-hidden="true"></span></span></h2>
            <div class="ant-card-extra">
                <div class="forecast-controls">
                    <!-- A checkbox, not a third picker: this is a single boolean and
                         its state has to be visible without opening a menu, because it
                         changes every number on the card. Checked (the default)
                         excludes transfers, since money moved between the user's own
                         accounts is not spending. -->
                    <label class="ant-checkbox-wrapper fc-toggle" for="forecast-ignore-transfers"
                        title="Leave money moved between your own accounts out of the projection">
                        <input type="checkbox" class="ant-checkbox" id="forecast-ignore-transfers" checked>
                        <span>Ignore transfers</span>
                    </label>
                    <!-- Account and horizon are the SAME widget (the Select-drawn
                         .range-selector) rather than a native <select> next to a
                         styled one. -->
                    <div class="range-selector" id="forecast-account">
                        <button class="range-selector-btn" id="forecast-account-btn" type="button"
                            aria-haspopup="menu" title="Account to forecast">Account<span class="anticon picker-caret" data-ant-icon="down" aria-hidden="true"></span></button>
                    </div>
                    <div class="range-selector" id="forecast-range">
                        <button class="range-selector-btn" id="forecast-range-btn" type="button"
                            aria-haspopup="menu">3 Months<span class="anticon picker-caret" data-ant-icon="down" aria-hidden="true"></span></button>
                        <div class="range-selector-menu" id="forecast-range-menu" hidden>
                            <button data-months="1" type="button">1 Month</button>
                            <button data-months="3" type="button">3 Months</button>
                            <button data-months="6" type="button">6 Months</button>
                        </div>
                    </div>
                    <!-- Hidden until it has something to offer: its only entry is
                         clearing planned items that fell outside the forecast, so an
                         always-present ⋮ would open on an empty menu. -->
                    <button type="button" class="ant-btn ant-btn-text ant-btn-icon-only" id="forecast-kebab-btn"
                        aria-label="Forecast options" data-tip="Forecast options" aria-haspopup="menu" hidden><span
                        class="anticon" data-ant-icon="more" aria-hidden="true"></span></button>
                </div>
            </div>
        </div></div>

        <div class="ant-card-body">
            <!-- The result in a sentence, then a warning only when the balance goes
                 below zero, then the caveat notes. Built by forecast.js. -->
            <div class="forecast-summary" id="forecast-summary"></div>

            <!-- The plot and its pointer overlay (the add-here guide) share this
                 box; forecast.js sizes the overlay to the SVG it just drew. -->
            <div class="chart-area">
                <div class="forecast-plot" id="forecast-plot">
                    <div id="forecast-chart"></div>
                    <div class="fc-overlay" id="forecast-overlay" aria-hidden="true"></div>
                </div>
            </div>
        </div>
    </section>

</div>

    </div><!-- /.rep-panel -->

    <div class="rep-panel" id="rep-panel-metrics" role="tabpanel"
        data-panel="metrics" aria-labelledby="rep-tab-metrics" tabindex="0" hidden>

<div class="metrics-page">

    <!-- The old standalone "Yearly Report Card" page, which nothing linked to,
         living here as a report instead. ONE year at a time, chosen from the
         picker: every other report on this page is read that way, and the
         ratios drawn as gauges need the width that stacking every year side by
         side was spending. The whole report is ONE card (.met-shell): the
         chosen year as its title, the picker as its extra, and the two
         sections below as inner cards, so the year reads as the title of
         everything under it. Controller: static/js/pages/metrics.js. -->
    <section class="ant-card met-shell" aria-labelledby="metrics-year-heading">
    <div class="ant-card-head"><div class="ant-card-head-wrapper">
        <h2 class="ant-card-head-title met-year" id="metrics-year-heading" aria-live="polite"></h2>
        <!-- The Cash Flow tab's joined year+month picker, same markup and same
             UI.wirePicker wiring: the left half picks the year, the right half
             picks how much of it to report on — "Entire year", or one month of
             it with the year still shown beside it. -->
        <div class="ant-card-extra">
            <div class="range-selector-pair">
                <div class="range-selector" id="metrics-year">
                    <button class="range-selector-btn" id="metrics-year-btn" type="button"
                        aria-haspopup="menu" title="Year shown by every section below">Year<span class="anticon picker-caret" data-ant-icon="down" aria-hidden="true"></span></button>
                    <div class="range-selector-menu" id="metrics-year-menu" hidden></div>
                </div>
                <div class="range-selector" id="metrics-month">
                    <button class="range-selector-btn" id="metrics-month-btn" type="button"
                        aria-haspopup="menu" title="Span shown by every section below">Entire year<span class="anticon picker-caret" data-ant-icon="down" aria-hidden="true"></span></button>
                    <div class="range-selector-menu" id="metrics-month-menu" hidden></div>
                </div>
            </div>
        </div>
    </div></div>

    <div class="ant-card-body met-shell-body">

    <section class="ant-card ant-card-type-inner met-card" aria-labelledby="metrics-fundamentals-title">
        <div class="ant-card-head"><div class="ant-card-head-wrapper">
            <h3 class="ant-card-head-title" id="metrics-fundamentals-title">Fundamentals<span class="ant-info-tip" tabindex="0" role="note"
                aria-label="The selected year's totals, the ratios behind them, and six money goals: spending under 70% of income, total debt under 25% of income, saving at least 20% of income, investing 15% to 20% of income, spending down year over year, and income up year over year. Transfers between your own accounts are never counted as income or spending."
                data-tip="The selected year's totals, the ratios behind them, and six money goals: spending under 70% of income, total debt under 25% of income, saving at least 20% of income, investing 15% to 20% of income, spending down year over year, and income up year over year. Transfers between your own accounts are never counted as income or spending."><span class="anticon" data-ant-icon="info-circle-outlined" aria-hidden="true"></span></span></h3>
        </div></div>

        <div class="ant-card-body" id="metrics-body"></div>
    </section>

    <!-- Vitals is its own inner card, not a section of the one above. Two
         questions — what the year totalled, what its ratios say — read as two
         answers, and the card border is the separator this page already uses
         everywhere else. It starts hidden: metrics.js reveals it once there is
         a year to fill it, so a database with nothing in it shows one empty
         state rather than two. -->
    <section class="ant-card ant-card-type-inner met-card" id="metrics-vitals-card" aria-labelledby="metrics-vitals-title" hidden>
        <div class="ant-card-head"><div class="ant-card-head-wrapper">
            <h3 class="ant-card-head-title" id="metrics-vitals-title">Vitals</h3>
        </div></div>
        <div class="ant-card-body" id="metrics-vitals"></div>
    </section>

    </div><!-- /.met-shell-body -->
    </section><!-- /.met-shell -->

</div>

    </div><!-- /.rep-panel -->

</div><!-- /.rep-reports -->

        </div>
    </div>

    <!-- @include scripts -->
    <!-- Ant Design's interactive pieces (tooltips, icons, Empty, Modal,
         message). After the shared block: its Modal is UI.dialog underneath. -->
    <script src="/static/js/widgets/ant.js"></script>
    <!-- Merchant avatars: the generated slug→icon manifest, then the renderer
         that reads it. Page-level rather than shared chrome — see the note in
         pages/partials/scripts.html. Manifest first: avatar.js reads
         window.MERCHANT_ICONS. -->
    <script src="/static/js/core/merchant-icons.js"></script>
    <script src="/static/js/core/avatar.js"></script>
    <!-- The shared chart geometry (core/chartmath.js). Per-page rather than in
         the shared block: only this page and /reports draw charts, so the other
         four would parse it for nothing. It has no dependencies and must load
         before any script that draws. -->
    <script src="/static/js/core/chartmath.js"></script>
    <script src="/static/js/pages/reports.js"></script>
    <script src="/static/js/widgets/chart.js"></script>
    <script src="/static/js/widgets/forecast.js"></script>
    <script src="/static/js/widgets/cashflow-sankey.js"></script>
    <script src="/static/js/pages/trends.js"></script>
    <script src="/static/js/pages/topmerchants.js"></script>
    <script src="/static/js/pages/transfers.js"></script>
    <script src="/static/js/pages/metrics.js"></script>
</body>
</html>
